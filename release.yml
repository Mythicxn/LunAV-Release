name: Build launcher release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable launcher
        run: npm run build

      - name: Verify build metadata
        shell: pwsh
        run: |
          $artifact = Get-Item "dist\LunAV-Launcher.exe"
          if ($artifact.Length -lt 1MB) {
            throw "The launcher artifact is missing or unexpectedly small."
          }

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $metadata = $artifact.VersionInfo
          if ($metadata.ProductName -ne "LunAV Launcher") {
            throw "Unexpected product name: $($metadata.ProductName)"
          }
          if (-not $metadata.ProductVersion.StartsWith($version)) {
            throw "Product version '$($metadata.ProductVersion)' does not match package version '$version'."
          }

      - name: Upload launcher to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "dist\LunAV-Launcher.exe" --clobber
